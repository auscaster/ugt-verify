name: verify

# Verifies the recipes one pull request to auscaster/ugt changes, with ugt from
# auscaster/ugt's main, on clean amd64 and arm64 machines, and reports to the
# catalogue service. Only the catalogue service and maintainers start it, from
# this repository's main, so no pull request can change these steps; the
# service trusts a report only from this workflow there, as the run's OIDC
# token proves. Nothing here holds a secret or keeps a cache. Inputs are read
# through the environment, and checked before anything uses them.

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: The pull request in auscaster/ugt
        required: true
      head:
        description: Its head commit
        required: true
      recipes:
        description: The recipes it changes, as a JSON list of IDs
        required: true
      approved:
        description: A maintainer reviewed the access these recipes declare
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: verify-${{ inputs.pull_request }}
  cancel-in-progress: true

env:
  SERVICE: https://api.usegithubthing.com
  CANDIDATES: ghcr.io/auscaster/ugt-candidates

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      stage: ${{ steps.read.outputs.stage }}
      verify: ${{ steps.read.outputs.verify }}
      ugt: ${{ steps.read.outputs.ugt }}
    steps:
      - name: Check the inputs
        id: inputs
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD: ${{ inputs.head }}
          RECIPES: ${{ inputs.recipes }}
        run: |
          set -euo pipefail
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "pull_request is not a number"; exit 1; }
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "head is not a commit"; exit 1; }
          jq -e 'type == "array" and length > 0 and length <= 20 and all(.[]; type == "string"
            and test("^[a-z0-9][a-z0-9._-]{0,99}/[a-z0-9][a-z0-9._-]{0,99}/[a-z0-9]+(-[a-z0-9]+)*$"))' <<< "$RECIPES" > /dev/null
          { echo "folders<<EOF"; jq -r '.[] | "recipes/" + .' <<< "$RECIPES"; echo EOF; } >> "$GITHUB_OUTPUT"

      - name: ugt, from auscaster/ugt's main
        uses: actions/checkout@v4
        with:
          repository: auscaster/ugt
          ref: main
          path: ugt
          persist-credentials: false
          token: ${{ secrets.UGT_READ_TOKEN || github.token }} # only while auscaster/ugt is private
          sparse-checkout: |
            /*
            !/recipes/
          sparse-checkout-cone-mode: false

      - name: The recipes, from the pull request's head
        uses: actions/checkout@v4
        with:
          repository: auscaster/ugt
          ref: ${{ inputs.head }}
          path: head
          persist-credentials: false
          token: ${{ secrets.UGT_READ_TOKEN || github.token }}
          sparse-checkout: ${{ steps.inputs.outputs.folders }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: ugt/go.mod
          cache: false

      - name: Build ugt
        working-directory: ugt
        run: go build -o "$RUNNER_TEMP/ugt" ./cmd/ugt

      - name: Read each recipe for admission
        id: read
        env:
          RECIPES: ${{ inputs.recipes }}
          APPROVED: ${{ inputs.approved }}
        run: |
          set -euo pipefail
          records='[]'
          while read -r id; do
            if [ -f "head/recipes/$id/recipe.json" ]; then
              record=$("$RUNNER_TEMP/ugt" recipe validate --admit --json "head/recipes/$id" | jq -c '.[0]') || true
            else
              record=$(jq -nc --arg id "$id" '{recipe: $id, removed: true}')
            fi
            records=$(jq -c --argjson r "$record" '. + [$r]' <<< "$records")
          done < <(jq -r '.[]' <<< "$RECIPES")
          printf '%s' "$records" > "$RUNNER_TEMP/records.json"
          # every later job builds this same ugt, however main moves meanwhile
          echo "ugt=$(git -C ugt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          gated=$(jq '[.[] | .gated // [] | .[]] | length' <<< "$records")
          stage=verified
          if [ "$gated" -gt 0 ] && [ "$APPROVED" != "true" ]; then stage=held; fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "verify=$(jq -c '[.[] | select((.removed | not) and ((.problems // []) | length == 0)) | .recipe]' <<< "$records")" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.recipe): \(if .removed then "removed" elif (.problems // []) | length > 0 then (.problems | join("; ")) else "revision \(.revision)" end)"' <<< "$records"

      - name: Keep the records
        uses: actions/upload-artifact@v4
        with:
          name: records
          path: ${{ runner.temp }}/records.json

      - name: Report a held verification
        if: steps.read.outputs.stage == 'held'
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD: ${{ inputs.head }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n --slurpfile records "$RUNNER_TEMP/records.json" --argjson run "$RUN" --argjson pr "$PULL_REQUEST" \
            --arg head "$HEAD" --arg ugt "${{ steps.read.outputs.ugt }}" \
            '{format: "ugt-admission-v0", stage: "held", run: $run, pull_request: $pr, head: $head, ugt: $ugt, recipes: $records[0]}' > report.json
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$SERVICE" | jq -r .value)
          curl -sSf -X POST -H "Authorization: Bearer $token" -H "content-type: application/json" --data-binary @report.json "$SERVICE/v1/admission/reports"

  verify:
    needs: read
    if: needs.read.outputs.stage == 'verified' && needs.read.outputs.verify != '[]'
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.read.outputs.verify) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - name: ugt, at the commit the read job built
        uses: actions/checkout@v4
        with:
          repository: auscaster/ugt
          ref: ${{ needs.read.outputs.ugt }}
          path: ugt
          persist-credentials: false
          token: ${{ secrets.UGT_READ_TOKEN || github.token }}
          sparse-checkout: |
            /*
            !/recipes/
          sparse-checkout-cone-mode: false

      - name: The recipe, from the pull request's head
        uses: actions/checkout@v4
        with:
          repository: auscaster/ugt
          ref: ${{ inputs.head }}
          path: head
          persist-credentials: false
          token: ${{ secrets.UGT_READ_TOKEN || github.token }}
          sparse-checkout: recipes/${{ matrix.recipe }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: ugt/go.mod
          cache: false

      - name: Build ugt
        working-directory: ugt
        run: go build -o "$RUNNER_TEMP/ugt" ./cmd/ugt

      - name: Verify, and stage the verified images
        env:
          RECIPE: ${{ matrix.recipe }}
          ARCH: ${{ matrix.arch }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the access a recipe declares is agreed here: verifying it is the point
          "$RUNNER_TEMP/ugt" recipe verify --allow --json "head/recipes/$RECIPE" > report.json || true
          jq '{passed, seconds, steps: [.steps[] | {name, exit, seconds}]}' report.json
          images='{}'
          if [ "$(jq .passed report.json)" = true ]; then
            rev=$(jq -r .revision report.json)
            docker login ghcr.io -u "$ACTOR" --password-stdin <<< "$GH_TOKEN"
            while read -r image; do
              suffix="${image##*:"$rev"}"
              target="$CANDIDATES:$rev$suffix-$ARCH"
              docker tag "$image" "$target"
              docker push --quiet "$target"
              digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$target" | cut -d@ -f2)
              images=$(jq -c --arg s "$suffix" --arg d "$digest" '. + {($s): $d}' <<< "$images")
            done < <(docker image ls --filter "label=com.usegithubthing.recipe=$RECIPE" --filter "label=com.usegithubthing.rev=$rev" \
              --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>' | sort -u)
          fi
          jq -c --arg recipe "$RECIPE" --arg arch "$ARCH" --argjson images "$images" \
            '{recipe: $recipe, arch: $arch, passed: (.passed == true), seconds: (.seconds // 0), report: ., images: $images}' report.json > result.json
          echo "name=result-$(tr '/' '_' <<< "$RECIPE")-$ARCH" >> "$GITHUB_ENV"

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: result.json
          if-no-files-found: ignore

  report:
    needs: [read, verify]
    if: always() && needs.read.outputs.stage == 'verified'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Join each recipe's images, and report
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD: ${{ inputs.head }}
          RUN: ${{ github.run_id }}
          UGT: ${{ needs.read.outputs.ugt }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker login ghcr.io -u "$ACTOR" --password-stdin <<< "$GH_TOKEN"
          results=$(cat artifacts/result-*/result.json 2> /dev/null | jq -s '.')
          out='[]'
          while read -r record; do
            id=$(jq -r .recipe <<< "$record")
            mine=$(jq -c --arg id "$id" '[.[] | select(.recipe == $id)]' <<< "$results")
            images='{}'
            # an image is staged once its recipe passed on both architectures
            if [ "$(jq '[.[] | select(.passed)] | length' <<< "$mine")" = 2 ]; then
              rev=$(jq -r .revision <<< "$record")
              while IFS= read -r suffix; do
                mapfile -t sources < <(jq -r --arg s "$suffix" --arg at "$CANDIDATES@" '.[] | .images[$s] // empty | $at + .' <<< "$mine")
                [ "${#sources[@]}" = 2 ] || continue
                docker buildx imagetools create --tag "$CANDIDATES:$rev$suffix" "${sources[@]}"
                digest=$(docker buildx imagetools inspect "$CANDIDATES:$rev$suffix" --format '{{json .Manifest}}' | jq -r .digest)
                images=$(jq -c --arg s "$suffix" --arg d "$digest" '. + {($s): {digest: $d, arches: ["amd64", "arm64"]}}' <<< "$images")
              done < <(jq -r '[.[] | .images | keys[]] | unique | .[]' <<< "$mine")
            fi
            out=$(jq -c --argjson r "$record" --argjson m "$mine" --argjson images "$images" \
              '. + [$r + {verified: [$m[] | {arch, passed, seconds, report}]} + (if $images == {} then {} else {images: $images} end)]' <<< "$out")
          done < <(jq -c '.[]' artifacts/records/records.json)
          jq -n --argjson recipes "$out" --argjson run "$RUN" --argjson pr "$PULL_REQUEST" --arg head "$HEAD" --arg ugt "$UGT" \
            '{format: "ugt-admission-v0", stage: "verified", run: $run, pull_request: $pr, head: $head, ugt: $ugt, recipes: $recipes}' > report.json
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$SERVICE" | jq -r .value)
          curl -sSf -X POST -H "Authorization: Bearer $token" -H "content-type: application/json" --data-binary @report.json "$SERVICE/v1/admission/reports"
