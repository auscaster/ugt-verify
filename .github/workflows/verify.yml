name: verify

# Verifies recipes with ugt from auscaster/ugt's main, on clean amd64 and arm64
# machines, and reports to the catalogue service. Only the catalogue service and
# maintainers start it, from this repository's main, so no pull request can
# change these steps; the service trusts a report only from this workflow
# there, as the run's OIDC token proves. It runs in one of two modes:
#
# - verify: the recipes one pull request changes, at its head. Nothing the run
#   builds leaves it. A recipe whose run revision (every file but recipe.json)
#   the service already verified is read and reported, not run again: only its
#   recipe.json changed.
# - publish: merged recipes, as main holds them. The run verifies them again and
#   pushes the images it verified, unchanged, to ghcr.io/auscaster/ugt/recipes.
#
# Recipe code runs only in the verify job, whose token can do nothing: it takes
# ugt and the recipes from the read job, and hands back its results (and, when
# publishing, its images) as artifacts. Only jobs that run no recipe code read
# auscaster/ugt, report or push. Nothing here keeps a cache. Inputs are read
# through the environment, and checked before anything uses them.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify a pull request's head, or publish merged recipes from main
        type: choice
        options: [verify, publish]
        default: verify
      recipes:
        description: The recipes, as a JSON list of IDs
        required: true
      pull_request:
        description: To verify, the pull request in auscaster/ugt
        default: ""
      head:
        description: To verify, its head commit
        default: ""
      approved:
        description: To verify, a maintainer reviewed the access these recipes declare
        type: boolean
        default: false
      verified_runs:
        description: To verify, the run revisions the service already verified, as a JSON list
        default: "[]"

permissions: {}

concurrency:
  # a pull request's newer head replaces its older run; publishing runs never wait on each other
  group: ${{ inputs.mode == 'verify' && format('verify-{0}', inputs.pull_request) || format('publish-{0}', github.run_id) }}
  cancel-in-progress: ${{ inputs.mode == 'verify' }}

env:
  SERVICE: https://api.usegithubthing.com
  PACKAGE: ghcr.io/auscaster/ugt/recipes

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
    outputs:
      stage: ${{ steps.read.outputs.stage }}
      verify: ${{ steps.read.outputs.verify }}
      ugt: ${{ steps.read.outputs.ugt }}
      head: ${{ steps.read.outputs.head }}
    steps:
      - name: Check the inputs
        id: inputs
        env:
          MODE: ${{ inputs.mode }}
          RECIPES: ${{ inputs.recipes }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD: ${{ inputs.head }}
          APPROVED: ${{ inputs.approved }}
          VERIFIED_RUNS: ${{ inputs.verified_runs }}
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length <= 20 and all(.[]; type == "string" and test("^[0-9a-f]{12}$"))' <<< "$VERIFIED_RUNS" > /dev/null
          case "$MODE" in
            verify)
              [[ "$PULL_REQUEST" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "pull_request is not a number"; exit 1; }
              [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "head is not a commit"; exit 1; }
              echo "ref=$HEAD" >> "$GITHUB_OUTPUT" ;;
            publish)
              [ -z "$PULL_REQUEST$HEAD" ] && [ "$APPROVED" = false ] && [ "$VERIFIED_RUNS" = "[]" ] || { echo "publishing reads main: give no pull request, head, approval or verified runs"; exit 1; }
              echo "ref=main" >> "$GITHUB_OUTPUT" ;;
            *) echo "mode is verify or publish"; exit 1 ;;
          esac
          jq -e 'type == "array" and length > 0 and length <= 20 and all(.[]; type == "string"
            and test("^[a-z0-9][a-z0-9._-]{0,99}/[a-z0-9][a-z0-9._-]{0,99}/[a-z0-9]+(-[a-z0-9]+)*$"))' <<< "$RECIPES" > /dev/null
          { echo "folders<<EOF"; jq -r '.[] | "recipes/" + .' <<< "$RECIPES"; echo EOF; } >> "$GITHUB_OUTPUT"

      # UGT_READ_KEY is a read-only deploy key on auscaster/ugt, only while it is private
      - name: ugt, from auscaster/ugt's main
        uses: actions/checkout@v4
        with:
          repository: auscaster/ugt
          ref: main
          path: ugt
          persist-credentials: false
          ssh-key: ${{ secrets.UGT_READ_KEY }}
          sparse-checkout: |
            /*
            !/recipes/
          sparse-checkout-cone-mode: false

      - name: The recipes, from the pull request's head or main
        uses: actions/checkout@v4
        with:
          repository: auscaster/ugt
          ref: ${{ steps.inputs.outputs.ref }}
          path: head
          persist-credentials: false
          ssh-key: ${{ secrets.UGT_READ_KEY }}
          sparse-checkout: ${{ steps.inputs.outputs.folders }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: ugt/go.mod
          cache: false

      - name: Build ugt for both architectures
        working-directory: ugt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -o "$RUNNER_TEMP/work/ugt-$arch" ./cmd/ugt
          done

      - name: Read each recipe for admission
        id: read
        env:
          MODE: ${{ inputs.mode }}
          RECIPES: ${{ inputs.recipes }}
          APPROVED: ${{ inputs.approved }}
          VERIFIED_RUNS: ${{ inputs.verified_runs }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          records='[]'
          while read -r id; do
            if [ -f "head/recipes/$id/recipe.json" ]; then
              record=$("$work/ugt-amd64" recipe validate --admit --json "head/recipes/$id" | jq -c '.[0]') || true
              mkdir -p "$work/recipes/$(dirname "$id")"
              cp -a "head/recipes/$id" "$work/recipes/$id"
            else
              record=$(jq -nc --arg id "$id" '{recipe: $id, removed: true}')
            fi
            records=$(jq -c --argjson r "$record" '. + [$r]' <<< "$records")
          done < <(jq -r '.[]' <<< "$RECIPES")
          printf '%s' "$records" > "$work/records.json"
          # every later job uses this same ugt and these same recipes, however main moves meanwhile
          echo "ugt=$(git -C ugt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head=$(git -C head rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # a recipe whose run the service verified changed only its recipe.json: nothing to run
          verify=$(jq -c --argjson known "$VERIFIED_RUNS" '[.[] | select((.removed | not) and ((.problems // []) | length == 0)
            and (.run as $r | $known | index($r) | not)) | .recipe]' <<< "$records")
          stage=verified
          if [ "$MODE" = publish ]; then
            stage=published
          elif [ "$(jq --argjson v "$verify" '[.[] | select(.recipe as $id | $v | index($id)) | .gated // [] | .[]] | length' <<< "$records")" -gt 0 ] && [ "$APPROVED" != true ]; then
            stage=held
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "verify=$verify" >> "$GITHUB_OUTPUT"
          jq -r --argjson v "$verify" '.[] | "\(.recipe): \(if .removed then "removed" elif (.problems // []) | length > 0 then (.problems | join("; "))
            elif (.recipe as $id | $v | index($id)) then "revision \(.revision), run \(.run)" else "revision \(.revision): only recipe.json changed; run \(.run) was verified" end)"' <<< "$records"
          # an artifact keeps no file modes, and a recipe's scripts need theirs
          tar -cf "$RUNNER_TEMP/work.tar" -C "$work" .

      - name: Hand ugt and the recipes to the later jobs
        uses: actions/upload-artifact@v4
        with:
          name: work
          path: ${{ runner.temp }}/work.tar
          retention-days: 1

      - name: Report a held verification
        if: steps.read.outputs.stage == 'held'
        env:
          RUN: ${{ github.run_id }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD: ${{ steps.read.outputs.head }}
          UGT: ${{ steps.read.outputs.ugt }}
        run: |
          set -euo pipefail
          jq -n --slurpfile records "$RUNNER_TEMP/work/records.json" --argjson run "$RUN" --argjson pr "$PULL_REQUEST" \
            --arg head "$HEAD" --arg ugt "$UGT" \
            '{format: "ugt-admission-v0", stage: "held", run: $run, pull_request: $pr, head: $head, ugt: $ugt, recipes: $records[0]}' > report.json
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$SERVICE" | jq -r .value)
          curl -sSf --retry 4 --retry-all-errors --retry-delay 15 -X POST -H "Authorization: Bearer $token" \
            -H "content-type: application/json" --data-binary @report.json "$SERVICE/v1/admission/reports"

  verify:
    needs: read
    if: needs.read.outputs.stage != 'held' && needs.read.outputs.verify != '[]'
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.read.outputs.verify) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - name: Name this result
        env:
          RECIPE: ${{ matrix.recipe }}
          ARCH: ${{ matrix.arch }}
        run: echo "name=$(tr '/' '_' <<< "$RECIPE")-$ARCH" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: work
          path: ${{ runner.temp }}

      - name: Verify
        env:
          MODE: ${{ inputs.mode }}
          RECIPE: ${{ matrix.recipe }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          mkdir -p "$work" "out/$name"
          tar -xf "$RUNNER_TEMP/work.tar" -C "$work"
          # the access a recipe declares is agreed here: verifying it is the point
          "$work/ugt-$ARCH" recipe verify --allow --json "$work/recipes/$RECIPE" > report.json || true
          jq '{passed, seconds, steps: [.steps[] | {name, exit, seconds}]}' report.json
          jq -c --arg recipe "$RECIPE" --arg arch "$ARCH" \
            '{recipe: $recipe, arch: $arch, passed: (.passed == true), seconds: (.seconds // 0), report: .}' report.json > "out/$name/result.json"
          # publishing, each image the run verified goes to the report job exactly as it is
          if [ "$MODE" = publish ] && [ "$(jq .passed report.json)" = true ]; then
            run=$(jq -r .run report.json)
            while read -r image; do
              docker save --output "out/$name/image${image##*:"$run"}.tar" "$image"
            done < <(docker image ls --filter "label=com.usegithubthing.recipe=$RECIPE" --filter "label=com.usegithubthing.rev=$run" \
              --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>' | sort -u)
          fi

      - name: Hand back the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: out/${{ env.name }}
          if-no-files-found: ignore
          retention-days: 1

  report:
    needs: [read, verify]
    if: always() && needs.read.result == 'success' && needs.read.outputs.stage != 'held'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Unpack the records
        run: tar -xf artifacts/work/work.tar ./records.json

      # Each image goes into one OCI layout per recipe and suffix, its two architectures joined
      # under one index, then pushed with every digest kept: the index digest reported is the one
      # users pull. A recipe that passed but builds nothing of its own is reported with no images.
      - name: Publish each recipe that passed on both architectures
        if: inputs.mode == 'publish'
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skopeo login ghcr.io -u "$ACTOR" --password-stdin <<< "$GH_TOKEN"
          published='{}'
          while read -r id; do
            name=$(tr '/' '_' <<< "$id")
            run=$(jq -r --arg id "$id" '.[] | select(.recipe == $id) | .run' records.json)
            passed=$(cat artifacts/"$name"-amd64/result.json artifacts/"$name"-arm64/result.json 2> /dev/null | jq -s '[.[] | select(.passed)] | length')
            [ "$passed" = 2 ] || continue
            images='{}'
            for archive in artifacts/"$name"-amd64/image*.tar; do
              [ -e "$archive" ] || continue
              file=$(basename "$archive")
              suffix=${file#image}
              suffix=${suffix%.tar}
              [ -f "artifacts/$name-arm64/$file" ] || { echo "$id has no arm64 $file"; exit 1; }
              layout="$RUNNER_TEMP/layout"
              rm -rf "$layout"
              entries='[]'
              for arch in amd64 arm64; do
                skopeo copy --quiet "docker-archive:artifacts/$name-$arch/$file" "oci:$layout:$arch"
                manifest=$(jq -c --arg a "$arch" '.manifests[] | select(.annotations["org.opencontainers.image.ref.name"] == $a) | {mediaType, digest, size}' "$layout/index.json")
                config=$(jq -r .config.digest "$layout/blobs/sha256/$(jq -r '.digest | ltrimstr("sha256:")' <<< "$manifest")")
                platform=$(jq -c '{architecture, os} + (if .variant then {variant} else {} end)' "$layout/blobs/sha256/${config#sha256:}")
                [ "$(jq -r .architecture <<< "$platform")" = "$arch" ] || { echo "$id's $arch image is built for $platform"; exit 1; }
                entries=$(jq -c --argjson m "$manifest" --argjson p "$platform" '. + [$m + {platform: $p}]' <<< "$entries")
              done
              jq -n -c -j --argjson m "$entries" '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: $m}' > "$RUNNER_TEMP/index.json"
              digest="sha256:$(sha256sum "$RUNNER_TEMP/index.json" | cut -d' ' -f1)"
              cp "$RUNNER_TEMP/index.json" "$layout/blobs/sha256/${digest#sha256:}"
              tag="$run$suffix"
              jq -n --arg d "$digest" --argjson s "$(wc -c < "$RUNNER_TEMP/index.json")" --arg t "$tag" \
                '{schemaVersion: 2, manifests: [{mediaType: "application/vnd.oci.image.index.v1+json", digest: $d, size: $s,
                  annotations: {"org.opencontainers.image.ref.name": $t}}]}' > "$layout/index.json"
              skopeo copy --all --preserve-digests "oci:$layout:$tag" "docker://$PACKAGE:$tag"
              pushed="sha256:$(skopeo inspect --raw "docker://$PACKAGE:$tag" | sha256sum | cut -d' ' -f1)"
              [ "$pushed" = "$digest" ] || { echo "$PACKAGE:$tag arrived as $pushed, not $digest"; exit 1; }
              echo "$PACKAGE:$tag is $digest"
              images=$(jq -c --arg s "$suffix" --arg d "$digest" '. + {($s): {digest: $d, arches: ["amd64", "arm64"]}}' <<< "$images")
            done
            published=$(jq -c --arg id "$id" --argjson i "$images" '. + {($id): $i}' <<< "$published")
          done < <(jq -r '.[] | select((.removed | not) and ((.problems // []) | length == 0)) | .recipe' records.json)
          printf '%s' "$published" > published.json

      - name: Report
        env:
          MODE: ${{ inputs.mode }}
          STAGE: ${{ needs.read.outputs.stage }}
          RUN: ${{ github.run_id }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD: ${{ needs.read.outputs.head }}
          UGT: ${{ needs.read.outputs.ugt }}
        run: |
          set -euo pipefail
          results=$(cat artifacts/*/result.json 2> /dev/null | jq -s '.')
          [ -f published.json ] || echo '{}' > published.json
          recipes=$(jq -c --argjson results "$results" --slurpfile published published.json '[.[] | .recipe as $id
            | . + {verified: [$results[] | select(.recipe == $id) | {arch, passed, seconds, report}]}
            | if $published[0] | has($id) then . + {images: $published[0][$id]} else . end]' records.json)
          jq -n --arg mode "$MODE" --arg stage "$STAGE" --argjson run "$RUN" --arg pr "$PULL_REQUEST" --arg head "$HEAD" \
            --arg ugt "$UGT" --argjson recipes "$recipes" \
            '{format: "ugt-admission-v0", stage: $stage, run: $run, head: $head, ugt: $ugt, recipes: $recipes}
              + (if $mode == "verify" then {pull_request: ($pr | tonumber)} else {} end)' > report.json
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$SERVICE" | jq -r .value)
          curl -sSf --retry 4 --retry-all-errors --retry-delay 15 -X POST -H "Authorization: Bearer $token" \
            -H "content-type: application/json" --data-binary @report.json "$SERVICE/v1/admission/reports"
